name: Build & Publish Android APK to GitHub Releases

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag version (e.g. v1.4.0)'
        required: false
        default: 'v1.4.0'
      admob_app_id:
        description: 'Google AdMob App ID (ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY)'
        required: false
        default: 'ca-app-pub-3940256099942544~3347511713'

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect Project Root or Subfolder
        id: project_dir
        run: |
          if [ -f "HYNAction1/package.json" ]; then
            echo "dir=HYNAction1" >> "$GITHUB_OUTPUT"
          elif [ -f "sproutling-android-release/package.json" ]; then
            echo "dir=sproutling-android-release" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            REV_TAG="${GITHUB_REF_NAME}"
          else
            REV_TAG="v1.4.${{ github.run_number }}"
          fi
          echo "rev_tag=${REV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21 (Supports Android Gradle 8+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Run Unit Tests
        working-directory: ${{ steps.project_dir.outputs.dir }}
        run: |
          npm install --legacy-peer-deps
          node --test src/game/rules.test.ts

      - name: Build Production Web Bundle (Vite + PWA Offline Service Worker)
        working-directory: ${{ steps.project_dir.outputs.dir }}
        env:
          VITE_ADMOB_APP_ID: ${{ github.event.inputs.admob_app_id || secrets.VITE_ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}
        run: npm run build

      - name: Initialize Capacitor Android Native Project
        working-directory: ${{ steps.project_dir.outputs.dir }}
        run: |
          rm -f capacitor.config.ts
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.hyn198911.sproutling3d",
            "appName": "Sproutling: Grove Guardian 3D",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF
          npm install --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: Inject AdMob App ID into AndroidManifest.xml
        working-directory: ${{ steps.project_dir.outputs.dir }}
        env:
          ADMOB_APP_ID: ${{ github.event.inputs.admob_app_id || secrets.VITE_ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i "s|</application>|  <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"${ADMOB_APP_ID}\"/>\n  </application>|g" "$MANIFEST"

      - name: Build Android APK & Google Play AAB Bundle
        working-directory: ${{ steps.project_dir.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease
          cp app/build/outputs/apk/debug/app-debug.apk "${GITHUB_WORKSPACE}/Sproutling-Grove-Guardian-${{ steps.project_dir.outputs.rev_tag }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${GITHUB_WORKSPACE}/Sproutling-Grove-Guardian.apk"
          cp app/build/outputs/bundle/release/app-release.aab "${GITHUB_WORKSPACE}/Sproutling-Grove-Guardian-${{ steps.project_dir.outputs.rev_tag }}.aab"

      - name: Upload Compiled APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sproutling-Grove-Guardian-${{ steps.project_dir.outputs.rev_tag }}
          path: |
            Sproutling-Grove-Guardian.apk
            Sproutling-Grove-Guardian-${{ steps.project_dir.outputs.rev_tag }}.apk
            Sproutling-Grove-Guardian-${{ steps.project_dir.outputs.rev_tag }}.aab

      - name: Attach APK & AAB to Existing Releases & Create Latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Also attach APK to v1.2.3 if that release exists
          gh release upload v1.2.3 \
            "Sproutling-Grove-Guardian.apk" \
            "Sproutling-Grove-Guardian-${{ steps.project_dir.outputs.rev_tag }}.apk" \
            "Sproutling-Grove-Guardian-${{ steps.project_dir.outputs.rev_tag }}.aab" \
            --clobber || true

      - name: Publish Compiled APK & AAB to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || steps.project_dir.outputs.rev_tag }}
          name: "Sproutling: Grove Guardian 3D (${{ steps.project_dir.outputs.rev_tag }}) — Android APK & Play Store Bundle"
          body: |
            ### 🌿 نگهبان جوانه: بیشه جادویی | Sproutling: Grove Guardian 3D (${{ steps.project_dir.outputs.rev_tag }})
            - **فایل نصب مستقیم اندروید (Direct Install APK)**: `Sproutling-Grove-Guardian.apk` / `Sproutling-Grove-Guardian-${{ steps.project_dir.outputs.rev_tag }}.apk`
            - **بسته انتشار گوگل پلی (Google Play Console AAB)**: `Sproutling-Grove-Guardian-${{ steps.project_dir.outputs.rev_tag }}.aab`
            - **زیرپوشه پروژه (Subfolder)**: `${{ steps.project_dir.outputs.dir }}`
            - **امکانات نسخه جدید (${{ steps.project_dir.outputs.rev_tag }})**:
              - بازطراحی سه‌بعدی مفصل‌دار قهرمان، دشمنان و باس (چشم‌های چندلایه با برق مردمک، دست‌ها و گوش‌های متحرک، سپر رونیک باس و پرتوهای خورشیدی بین نیایشگاه‌ها)
              - ارتقای معماری محیط سه‌بعدی با رنگ‌آمیزی Vertex چندبیومی (مسیرهای سنگ‌فرش طلایی به نیایشگاه‌ها)، بافت برجسته رویه‌ای (Bump Map)، برکه کریستالی و طاق‌های سنگی باستانی
              - روایت زنده داستانی در حین گیم‌پلی + قطب‌نمای سه‌بعدی هدف و راهنمای گام‌به‌گام رفتن به مرحله بعد
              - مسیریابی خودکار تبلیغات بر اساس کشور (تپسل پلاس و یکتانت برای ایران + Google AdMob جهانی با جایگزینی خودکار Waterfall)
              - ماموریت‌های روزانه (Daily Quests) و چهار سطح گرافیکی (Eco / Balanced / High / Ultra)
          files: |
            Sproutling-Grove-Guardian.apk
            Sproutling-Grove-Guardian-${{ steps.project_dir.outputs.rev_tag }}.apk
            Sproutling-Grove-Guardian-${{ steps.project_dir.outputs.rev_tag }}.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
