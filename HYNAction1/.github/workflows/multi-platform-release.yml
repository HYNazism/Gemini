name: Build Multi-Platform Releases (Windows EXE, Android APK/AAB, Linux, macOS, Web PWA)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Build WebGL & Offline PWA Bundle (.zip)
  build-web-pwa:
    name: WebGL & Offline PWA Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build Web Bundle
        run: |
          npm install --legacy-peer-deps
          npx vite build --base=./
          cd dist && zip -r ../Sproutling-Grove-Guardian-3D-Web-PWA.zip .

      - name: Upload WebGL & PWA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sproutling-Grove-Guardian-3D-Web-PWA
          path: Sproutling-Grove-Guardian-3D-Web-PWA.zip

  # 2. Build Android APK & Google Play AAB
  build-android:
    name: Android APK & Google Play AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web Bundle & Capacitor Android Project
        run: |
          npm install --legacy-peer-deps
          npm install -D @capacitor/cli@^6.0.0 @capacitor/core@^6.0.0 @capacitor/android@^6.0.0 --legacy-peer-deps
          npx vite build --base=./
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Assemble Android APK and AAB via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Collect Android Binaries
        run: |
          mkdir -p artifacts-android
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts-android/Sproutling-Grove-Guardian-3D-Android.apk
          if [ -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab artifacts-android/Sproutling-Grove-Guardian-3D-PlayStore.aab
          fi

      - name: Upload Android APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sproutling-Grove-Guardian-3D-Android-APK-AAB
          path: artifacts-android/*

  # 3. Build Desktop Executables (Windows EXE, Linux AppImage/DEB, macOS DMG/ZIP)
  build-desktop:
    name: Desktop Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_flag: --win
            artifact_name: Sproutling-Grove-Guardian-3D-Windows-EXE
          - os: ubuntu-latest
            platform_flag: --linux
            artifact_name: Sproutling-Grove-Guardian-3D-Linux-AppImage
          - os: macos-latest
            platform_flag: --mac
            artifact_name: Sproutling-Grove-Guardian-3D-macOS-DMG
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web Bundle & Package Native Desktop App
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm install --legacy-peer-deps
          npx vite build --base=./
          npx --yes electron-builder ${{ matrix.platform_flag }} --config electron-builder.yml --publish never

      - name: Upload Desktop Executables
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release-desktop/*.exe
            release-desktop/*.AppImage
            release-desktop/*.deb
            release-desktop/*.dmg
            release-desktop/*.zip

  # 4. Publish All Platform Binaries to GitHub Releases
  publish-github-release:
    name: Publish All Platforms to GitHub Releases
    needs: [build-web-pwa, build-android, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Built Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-release-binaries
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.${{ github.run_number }}
          name: "Sproutling: Grove Guardian 3D v1.6.${{ github.run_number }} (Windows EXE · Android APK/AAB · Linux · macOS · Web)"
          body: |
            ### 🌱 Sproutling: Grove Guardian 3D — Multi-Platform Release (v1.6.${{ github.run_number }})
            - **Non-Combative 'Sprout-Buddy' Pet Companion**: Follows Pip around procedural maps and highlights nearby Sun-Seeds and Shrine/Mission components with a 3D beacon.
            - **Dynamic Biome Ambient Soundscapes**: Procedural WebAudio soundtracks shifting across Forest, Mountain, Sakura, Crystal, and Starlight biomes.
            - **Available Downloads Below**:
              - 🪟 **Windows (`.exe`)**: Portable & Installer executables
              - 🤖 **Android (`.apk` & `.aab`)**: Direct install APK & Google Play Store AAB
              - 🐧 **Linux (`.AppImage` & `.deb`)**: Native Linux desktop packages
              - 🍎 **macOS (`.dmg` & `.zip`)**: macOS application bundles
              - 🌐 **WebGL / Offline PWA (`.zip`)**: Ready-to-host static WebGL build
          files: |
            all-release-binaries/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
